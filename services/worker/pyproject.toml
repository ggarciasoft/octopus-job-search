[project]
name = "job-getter-worker"
version = "0.0.0"
description = "Job Getter processing worker: parsing, normalization, matching, rendering and local browser assistance."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "pypdf>=5.4.0",
    "python-docx>=1.1.2",
    "jinja2>=3.1.6",
    "structlog>=25.2.0",
    "tenacity>=9.1.2",
]

[project.scripts]
job-getter-worker = "job_getter_worker.cli:main"
job-getter-runner = "job_getter_worker.runner_cli:main"

[project.optional-dependencies]
browser = ["playwright>=1.51.0"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.0",
    "respx>=0.22.0",
    "mypy>=1.15.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_getter_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "RUF",
    "ASYNC",
    "S",
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"src/job_getter_worker/contracts/generated/**" = ["ALL"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
exclude = "src/job_getter_worker/contracts/generated/.*"

[[tool.mypy.overrides]]
module = ["docx.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.uv]
system-certs = true
