# =============================================================================
# Job Getter - static bundle + /api reverse proxy
#
# This is a COMPLETE nginx.conf, not a conf.d fragment, because the top-level
# `pid` and `*_temp_path` directives have to be relocated for the server to run
# as a non-root user (see infra/web.Dockerfile).
#
# What is deliberately NOT proxied:
#   /internal/  - the worker task protocol. docs/spec/10_DEPLOYMENT.md requires
#                 internal worker routes to be unreachable from the public
#                 internet. The worker reaches the API directly over the
#                 Compose network; it never goes through this proxy. There is
#                 no location block for it, so it 404s here.
#   /health/*   - the API's liveness (/health/live) and readiness
#                 (/health/ready) probes. Orchestration checks the API
#                 container directly; exposing them through the UI origin would
#                 only add an unauthenticated surface.
# =============================================================================

worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Relocated so an unprivileged worker can write them.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Do not advertise the exact nginx patch version to the internet.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # The API service name and port come from the Compose network. They are
    # fixed here rather than templated because the official image's envsubst
    # helper needs a writable /etc/nginx/conf.d, which a non-root container
    # does not have. Override by mounting a replacement file if you rename the
    # service (see docker-compose.override.yml.example).
    upstream job_getter_api {
        server api:8080;
        keepalive 16;
    }

    server {
        listen      8080;
        listen      [::]:8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Uploads are bounded by the API (MAX_UPLOAD_BYTES, 10 MiB default).
        # This is the outer proxy bound; keep it at or above that value so the
        # API - not nginx - produces the structured 413 error envelope.
        client_max_body_size 12m;

        # Defence in depth for the UI origin. The API sets its own security
        # headers via @fastify/helmet; these cover the static document.
        add_header X-Content-Type-Options    "nosniff"            always;
        add_header X-Frame-Options           "DENY"               always;
        add_header Referrer-Policy           "no-referrer"        always;
        add_header Cross-Origin-Opener-Policy "same-origin"       always;

        # Proxy health probe for this container only. Returns no application
        # state and touches no upstream.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass         http://job_getter_api;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            # Required for the API's origin verification on state-changing
            # routes; dropping it would make every mutation look cross-origin.
            proxy_set_header Origin            $http_origin;
            proxy_set_header Connection        "";

            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            # Long enough for a synchronous file upload; async work returns 202
            # immediately and is polled through GET /api/v1/tasks/:id.
            proxy_read_timeout    60s;

            # Generated documents and exports stream through the API as
            # attachments; buffering them in nginx would only add latency.
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Hashed Vite assets are safe to cache immutably.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA history fallback. index.html itself must never be cached, or a
        # deploy leaves browsers pointing at asset hashes that no longer exist.
        location / {
            add_header Cache-Control "no-store" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
